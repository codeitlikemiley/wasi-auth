[graph]
all-features = true
targets = ["wasm32-wasip2"]

[advisories]
yanked = "deny"
# Temporary, non-vulnerability exceptions inherited only through Leptos 0.8.
# Review and remove when Leptos replaces the archived macro dependencies.
ignore = [
    # The process-wide wasi-auth JWT provider rejects RSA/PSS signing and RSA
    # private-key JWK extraction. rsa remains only for public-key verification
    # of provider-issued RS256 ID tokens. Remove when the upstream crate ships
    # a constant-time release or provider RS256 verification is replaced.
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2, unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# `wasip3 0.9.0+wasi-0.3.0` and the canonical middleware revision both embed
# wit-bindgen 0.62.0. Keep that generator singular.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary maintained fork for final-WASI Spin support. The dependency is
# additionally pinned to an immutable revision in Cargo.toml and Cargo.lock.
allow-git = [
    "https://github.com/codeitlikemiley/spin-rust-sdk",
    "https://github.com/codeitlikemiley/wasi-http-middleware",
]
