[package]
name = "wasi-authz-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
futures = "=0.3.32"
http = "=1.4.0"
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.145"
wasi-authz-client = { path = "../crates/wasi-authz-client" }
wasi-authz-contract = { path = "../crates/wasi-authz-contract" }

[workspace]
members = ["."]

[[bin]]
name = "authzen-json"
path = "fuzz_targets/authzen_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attributes"
path = "fuzz_targets/attributes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider-response"
path = "fuzz_targets/provider_response.rs"
test = false
doc = false
bench = false
