[package]
name = "wasi-auth"
description = "Production authentication, authorization, and trusted ingress for WASI applications"
version = "0.1.0-rc.5"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["wasi", "authentication", "authorization", "cedar", "grpc"]
categories = ["authentication", "web-programming"]
include = ["/src/**", "/migrations/**", "/README.md"]

[features]
default = []
password = ["dep:aes-gcm", "dep:argon2", "dep:zeroize"]
serde = []
json = ["serde"]
jwt = ["json", "dep:jsonwebtoken"]
oauth = ["dep:aes-gcm", "dep:base64", "dep:oauth2", "dep:zeroize"]
oauth-google = ["oauth"]
oauth-apple = ["oauth"]
oauth-facebook = ["oauth"]
passkeys = ["dep:aes-gcm", "dep:base64", "dep:passkey-auth", "dep:zeroize"]
mfa = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:subtle", "dep:zeroize"]
sessions = []
http = [
    "dep:base64",
    "dep:hmac",
    "dep:http",
    "dep:sha2",
    "dep:zeroize",
]
cedar = ["dep:base64", "dep:cedar-policy"]
spicedb = ["http"]
leptos = ["http", "dep:leptos"]
spin-grpc = ["http", "dep:bytes", "dep:http-body", "dep:wasip3"]
postgres-kernel = ["http", "dep:sha2", "dep:uuid"]
postgres-native = [
    "postgres-kernel",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]
postgres-spin = ["postgres-kernel", "dep:spin-sdk"]
mail-smtp = []
mail-http = ["http"]
mail-resend = ["mail-http"]
mail-capture = []
component-experimental = []
testkit = []
testkit-evaluator = ["testkit", "serde", "json"]
outbox-worker = [
    "password",
    "postgres-native",
    "mail-http",
    "mail-resend",
    "mail-capture",
    "spicedb",
    "dep:reqwest",
    "dep:getrandom",
    "dep:tracing",
    "dep:tracing-subscriber",
]
fullstack-spin = [
    "password",
    "jwt",
    "oauth",
    "oauth-google",
    "oauth-apple",
    "oauth-facebook",
    "passkeys",
    "mfa",
    "sessions",
    "http",
    "cedar",
    "leptos",
    "spin-grpc",
]

[dependencies]
aes-gcm = { version = "0.10.3", optional = true }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"], optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cedar-policy = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
getrandom = { version = "0.4.3", optional = true }
hmac = { version = "0.12.1", optional = true }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
leptos = { workspace = true, optional = true }
oauth2 = { version = "5.0.0", default-features = false, features = ["pkce-plain"], optional = true }
passkey-auth = { version = "0.1.3", optional = true }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std"], optional = true }
rustls-native-certs = { version = "=0.8.4", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha1 = { version = "0.10.6", optional = true }
sha2 = { version = "0.10.9", optional = true }
spin-sdk = { git = "https://github.com/codeitlikemiley/spin-rust-sdk", rev = "a02d330fe9357be2d18e6deef400511195ce6f7f", version = "6.0.0", default-features = false, features = ["json", "pg"], optional = true }
subtle = { version = "2.6.1", optional = true }
thiserror.workspace = true
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"], optional = true }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
wasip3 = { workspace = true, optional = true }
zeroize = { version = "1.8.2", optional = true }
uuid = { version = "1.23.4", features = ["serde", "v7"], optional = true }

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
http-body-util.workspace = true

[lints]
workspace = true

[[bin]]
name = "wasi-auth-outbox-worker"
path = "src/bin/wasi-auth-outbox-worker.rs"
required-features = ["outbox-worker"]
