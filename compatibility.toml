[release]
version = "0.1.0-rc.5"
channel = "rc"
publish = true

[rust]
msrv = "1.93.0"
current_stable = "stable"
component_target = "wasm32-wasip2"
native_ci_target = "x86_64-unknown-linux-gnu"

[wasi]
http = "0.3.0"
wasip2_crate = "0.14.7"
wasip3_crate = "0.7.0"
# `wit_bindgen` is the version this workspace's own component code binds with,
# pinned to match the generator embedded by tagged `wasip3 0.7.0`; mixed
# versions duplicate async stream intrinsics. Generate `wasip3 0.7.0` bindings
# with 0.57.1.
#
# `legacy_middleware_wit_bindgen` is what the excluded
# `legacy/wasi-http-middleware` workspace binds with, recorded here because the
# HTTP PEP depends on `wasi-http-middleware-component-support` and therefore
# links both generators. Both values are load-bearing; neither alone describes
# the shipped component.
wit_bindgen = "0.57.1"
legacy_middleware_wit_bindgen = "0.59.0"

[runtimes]
wasmtime = "46.0.1"
spin_stable = "4.0.2"
spin_main_version = "4.1.0-pre0"
spin_main_repository = "https://github.com/codeitlikemiley/spin"
