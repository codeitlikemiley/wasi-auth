[release]
version = "0.1.0-rc.5"
channel = "rc"
publish = true

[rust]
msrv = "1.99.0"
current_stable = "stable"
component_target = "wasm32-wasip2"
native_ci_target = "x86_64-unknown-linux-gnu"

[wasi]
http = "0.3.0"
wasip2_crate = "0.14.7"
wasip3_crate = "0.9.0+wasi-0.3.0"
# `wit_bindgen` is the version this workspace's own component code binds with,
# pinned to match the generator embedded by tagged `wasip3 0.9.0+wasi-0.3.0`.
# Generate those bindings with 0.62.0.
#
# `wit_bindgen` matches the generator embedded by tagged
# `wasip3 0.9.0+wasi-0.3.0`. `legacy_middleware_wit_bindgen` is the generator
# used by the canonical `wasi-http-middleware` revision. Both are 0.62.0.
# Preview 2 (`wasip2`) still brings its own `wit-bindgen` 0.57.1.
wit_bindgen = "0.62.0"
legacy_middleware_wit_bindgen = "0.62.0"

[runtimes]
wasmtime = "50.0.0"
spin_stable = "4.0.2"
spin_main_version = "4.1.0-pre0"
spin_main_repository = "https://github.com/codeitlikemiley/spin"
spin_main_revision = "c34c584dbf77b3a3528ad0536aa9ce4761b9f772"
spin_main_tag = "final-wasi-0.7-runtime-4.1.0-pre0"
spin_main_final_wasi_terminal = true
spin_main_final_wasi_outbound_http = true
spin_main_precomposed_default_features = false
spin_main_native_middleware = false
spin_sdk = "7.0.0"
spin_sdk_revision = "3cf30012b50a1afb750dac3d28aa6da4a32c3468"
spin_middleware_revision = "27451471b8ba0faeffa01c5a4ddd6daee9a9d526"
spin_final_wasi_blocking = false

[tools]
wasm_tools = "1.253.0"
wac = "0.10.1"
cargo_audit = "0.22.1"
cargo_deny = "0.20.2"
cargo_cyclonedx = "0.5.9"
cargo_fuzz = "0.13.2"
cargo_semver_checks = "0.48.0"
cargo_hack = "0.6.45"
fuzz_rust = "nightly-2026-03-06"
cosign = "3.1.1"
oras = "1.3.2"
spicedb = "1.54.0"
zed = "1.1.1"

[browser_integration]
wasm_bindgen = "0.2.126"
wasm_bindgen_wasi_fix = "0.2.123"

[tool_artifacts]
