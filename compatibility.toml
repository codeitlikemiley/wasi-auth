# Stabilization commit on gol/stabilize-middleware-contracts-894a. This is not
# an ancestor of wasi-auth. The next published tag is v0.2.0-alpha.4; until
# that tag exists, consumers pin this revision. Crate version stays
# 0.2.0-alpha.3 because that version already describes 61b4199.
