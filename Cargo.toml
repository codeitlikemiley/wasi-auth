[workspace]
members = [
    "components/cedar-pdp",
    "components/http-pep",
    "components/spicedb-pdp",
    "crates/leptos-wasi-authz",
    "crates/wasi-authz-cedar",
    "crates/wasi-authz-client",
    "crates/wasi-authz-contract",
    "crates/wasi-authz-http",
    "crates/wasi-authz-spicedb",
    "crates/wasi-authz-testkit",
    "services/cedar-pdp",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.3"
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeitlikemiley/wasi-authz"
homepage = "https://github.com/codeitlikemiley/wasi-authz"

[workspace.dependencies]
axum-core = "0.5.6"
base64 = "0.22.1"
bytes = "1.12.1"
cedar-policy = { version = "=4.11.2", default-features = false }
futures = "0.3.32"
http = "1.4.0"
http-body-util = "0.1.3"
leptos = { version = "0.8.20", default-features = false, features = ["ssr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
server_fn = { version = "0.8.12", default-features = false, features = ["axum-no-default"] }
thiserror = "2.0.17"
wasi-authz-contract = { path = "crates/wasi-authz-contract", version = "=0.1.0-alpha.3" }
wasi-authz-client = { path = "crates/wasi-authz-client", version = "=0.1.0-alpha.3" }
wasi-http-metadata = { path = "../wasi-http-middleware/crates/metadata", version = "=0.2.0-alpha.3" }
wasi-http-policy-core = { path = "../wasi-http-middleware/crates/policy-core", version = "=0.2.0-alpha.3" }
wasi-http-middleware-component-support = { path = "../wasi-http-middleware/crates/component-support", version = "=0.2.0-alpha.3" }
wasip3 = { version = "=0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "=0.59.0", features = ["async-spawn"] }

[workspace.lints.rust]
future-incompatible = "warn"
missing-docs = "deny"
nonstandard-style = "deny"
unsafe-code = "forbid"

[workspace.lints.clippy]
all = "deny"
dbg-macro = "deny"
todo = "deny"
unimplemented = "deny"
