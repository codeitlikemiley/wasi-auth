[workspace]
members = [
    "components/cedar-pdp",
    "components/http-pep",
    "components/spicedb-pdp",
    "crates/leptos-wasi-authz",
    "crates/wasi-auth",
    "crates/wasi-authz-cedar",
    "crates/wasi-authz-client",
    "crates/wasi-authz-contract",
    "crates/wasi-authz-http",
    "crates/wasi-authz-spicedb",
    "crates/wasi-authz-testkit",
    "services/cedar-pdp",
    "services/trusted-ingress",
    "tools/wasi-auth-migrate",
]
resolver = "2"
exclude = [
    "legacy/ddd-auth",
]

[workspace.package]
version = "0.1.0-rc.5"
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeitlikemiley/wasi-auth"
homepage = "https://github.com/codeitlikemiley/wasi-auth"

[workspace.dependencies]
axum-core = "0.5.6"
base64 = "0.22.1"
bytes = "1.12.1"
cedar-policy = { version = "=4.11.2", default-features = false }
futures = "0.3.32"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
leptos = { version = "0.8.20", default-features = false, features = ["ssr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
server_fn = { version = "=0.8.13", default-features = false, features = ["axum-no-default"] }
thiserror = "2.0.17"
wasi-authz-contract = { path = "crates/wasi-authz-contract", version = "=0.1.0-rc.5" }
wasi-authz-client = { path = "crates/wasi-authz-client", version = "=0.1.0-rc.5" }
wasi-http-metadata = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasi-http-policy-core = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasi-http-middleware-component-support = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasi-http-authn = { git = "https://github.com/codeitlikemiley/wasi-http-middleware", rev = "3df96c21a7906b885e67229e9a7c8c01b6497109", version = "=0.2.0-alpha.3" }
wasip3 = { version = "=0.9.0+wasi-0.3.0", features = ["http-compat"] }
# Match the generator embedded by tagged `wasip3 0.9.0+wasi-0.3.0` and by
# the canonical middleware revision above.
wit-bindgen = { version = "=0.62.0", features = ["async-spawn"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
