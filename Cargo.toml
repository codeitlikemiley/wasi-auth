[workspace]
members = [
    "crates/wasi-authz-contract",
    "crates/wasi-authz-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
authors = ["Uriah Galang <codeitlikemiley@gmail.com>"]
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeitlikemiley/wasi-authz"
homepage = "https://github.com/codeitlikemiley/wasi-authz"

[workspace.dependencies]
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
wasi-authz-contract = { path = "crates/wasi-authz-contract", version = "=0.1.0-alpha.1" }

[workspace.lints.rust]
future-incompatible = "warn"
missing-docs = "deny"
nonstandard-style = "deny"
unsafe-code = "forbid"

[workspace.lints.clippy]
all = "deny"
dbg-macro = "deny"
todo = "deny"
unimplemented = "deny"
