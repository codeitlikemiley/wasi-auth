name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DDD_CQRS_ES_SOURCE: ${{ github.workspace }}/ddd

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} quality gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.93.0", stable]
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: bash scripts/check-sibling-source.sh
      - if: matrix.toolchain == '1.93.0'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --all-features
      - if: matrix.toolchain == '1.93.0'
        run: cargo test --workspace --locked --doc
      - if: matrix.toolchain == '1.93.0'
        run: cargo doc --workspace --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dmissing-docs -Drustdoc::broken-intra-doc-links

  clients:
    name: Additive client (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [wasip2, wasip3, "wasip2,wasip3"]
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: cargo clippy --locked --package wasi-authz-client --all-targets --no-default-features --features '${{ matrix.features }}' -- -D warnings
      - run: cargo check --locked --target wasm32-wasip2 --package wasi-authz-client --no-default-features --features '${{ matrix.features }}'

  alpha-api-inventory:
    name: Private alpha API inventory
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: cargo install cargo-semver-checks --locked --version 0.48.0
      - run: bash scripts/check-alpha-api-inventory.sh

  dependency-policy:
    name: Dependency and advisory policy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check

  authzen-providers:
    name: AuthZEN and provider conformance
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: bash scripts/check-authzen-vectors.sh
      - run: cargo test --locked --package wasi-authz-cedar
      - run: cargo test --locked --package wasi-authz-spicedb

  spicedb-live:
    name: SpiceDB 1.54 live conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - name: Install checksum-verified SpiceDB and zed tools
        run: bash scripts/install-provider-tools.sh
        env:
          PROVIDER_TOOL_DIR: ${{ runner.temp }}/provider-tools
      - run: bash scripts/test-spicedb-live.sh
        env:
          SPICEDB_BIN: ${{ runner.temp }}/provider-tools/spicedb
          ZED_BIN: ${{ runner.temp }}/provider-tools/zed

  postgres-live:
    name: PostgreSQL relational kernel live contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_DB: wasi_auth_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wasi_auth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: bash scripts/test-postgres-kernel-live.sh
        env:
          WASI_AUTH_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/wasi_auth_ci

  component:
    name: Final-WASI component and artifact contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
          targets: wasm32-wasip2
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth
      - run: cargo install wasm-tools --locked --version 1.253.0
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: bash scripts/build-components.sh
      - run: bash scripts/build-native-pdp.sh
        env:
          NATIVE_TARGET: x86_64-unknown-linux-gnu
      - run: bash scripts/check-native-reproducibility.sh
        env:
          NATIVE_TARGET: x86_64-unknown-linux-gnu
      - run: bash scripts/test-cedar-pdp-live.sh
        env:
          NATIVE_TARGET: x86_64-unknown-linux-gnu
      - run: bash scripts/check-component-contracts.sh
      - run: bash scripts/generate-checksums.sh
      - run: bash scripts/generate-native-checksums.sh
        env:
          NATIVE_TARGET: x86_64-unknown-linux-gnu
      - run: bash scripts/generate-sbom.sh
      - name: Verify tracked artifact metadata
        run: git diff --exit-code -- artifacts/SHA256SUMS artifacts/sbom reports/wit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasi-auth-final-wasi-artifacts
          path: |
            wasi-auth/artifacts/
            wasi-auth/reports/wit/
          if-no-files-found: error

  fuzz:
    name: Authorization parser fuzz smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-03-06
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: bash scripts/run-fuzz-smoke.sh
        env:
          FUZZ_RUNS: "10000"

  package:
    name: Unpublished package structure
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: codeitlikemiley/ddd-cqrs-es
          ref: 737fa95c3c286a7904aca1f5ba59f342877a9579
          path: ddd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
      - run: bash scripts/configure-coordinated-ddd-source.sh
      - run: bash scripts/check-packages.sh

  supply-chain:
    name: Local OCI, provenance, and signature dry run
    needs: component
    runs-on: ubuntu-24.04
    env:
      GOBIN: ${{ github.workspace }}/go-bin
    defaults:
      run:
        working-directory: wasi-auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wasi-auth-final-wasi-artifacts
          path: wasi-auth
      - run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.1
      - run: go install oras.land/oras/cmd/oras@v1.3.2
      - run: bash scripts/dry-run-supply-chain.sh
        env:
          COSIGN_BIN: ${{ github.workspace }}/go-bin/cosign
          ORAS_BIN: ${{ github.workspace }}/go-bin/oras
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasi-auth-supply-chain-dry-run
          path: wasi-auth/reports/supply-chain/
          if-no-files-found: error
