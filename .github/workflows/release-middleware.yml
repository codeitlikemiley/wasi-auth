name: Release middleware

# Publishes the `legacy/wasi-http-middleware` bundle as release assets, from a
# tag and nothing else.
#
# This subtree produces a signed artifact bundle that a consumer pins by digest,
# but it had no release path: its bundle only ever existed as the output of
# whoever last ran `dry-run-supply-chain.sh` on their own machine. A consumer
# recording those digests pins a build nobody else can fetch, and the signing
# key is generated per run and discarded, so the signature digests cannot be
# reproduced even by re-running the same script on the same tree. Only an
# immutable published bundle can satisfy them. This workflow produces one.
#
# There is no crates.io publish job. The subtree is `publish = false` in its own
# `compatibility.toml` and sits on an independent version line from the root
# `wasi-auth` crate, so `release.yml` cannot cut this bundle as a side effect.

on:
  push:
    # Distinct from `release.yml`'s `v*` / `wasi-auth-v*` globs, so a root
    # release never fires this workflow and a middleware release never fires
    # that one. The two version lines move independently.
    tags: ["wasi-http-middleware-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify the tagged middleware tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOBIN: ${{ github.workspace }}/go-bin
    defaults:
      run:
        working-directory: wasi-auth/legacy/wasi-http-middleware
    steps:
      # The nested `path: wasi-auth` checkout matches ci.yml and release.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: wasi-auth
      - name: Require a released middleware version tag on main
        run: |
          source scripts/common.sh
          version="$(compat_value version)"
          if [[ "${GITHUB_REF_NAME}" != "wasi-http-middleware-v${version}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match the prepared" \
              "version ${version} in legacy/wasi-http-middleware/compatibility.toml;" \
              "expected wasi-http-middleware-v${version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: the tagged commit is not on main; releases are cut" \
              "only from verified mainline history" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.93.0
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: wasi-auth/legacy/wasi-http-middleware
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.2"
      - run: cargo install wasm-tools --locked --version 1.253.0
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.1
      - run: go install oras.land/oras/cmd/oras@v1.3.2
      # `artifacts/` is git-ignored in this subtree, so unlike the root
      # repository there is no tracked digest baseline to reproduce against. The
      # WIT reports are tracked, and `check-component-contracts.sh` regenerates
      # them, so the component interfaces are the one thing this tree can prove
      # unchanged — and the one thing a consumer's artifact set pins that does
      # not move with a rebuild.
      - name: Rebuild components and verify the tracked WIT contracts
        run: |
          bash scripts/build-components.sh
          bash scripts/check-component-contracts.sh
          bash scripts/generate-checksums.sh
          bash scripts/generate-sbom.sh
          git diff --exit-code -- reports/wit
      - name: Cut the attested release bundle
        run: bash scripts/dry-run-supply-chain.sh
        env:
          COSIGN_BIN: ${{ github.workspace }}/go-bin/cosign
          ORAS_BIN: ${{ github.workspace }}/go-bin/oras
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasi-http-middleware-release-bundle
          path: |
            wasi-auth/legacy/wasi-http-middleware/artifacts/
            wasi-auth/legacy/wasi-http-middleware/reports/wit/
            wasi-auth/legacy/wasi-http-middleware/reports/supply-chain/
          if-no-files-found: error

  release-assets:
    name: Upload the middleware bundle as assets
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wasi-auth/legacy/wasi-http-middleware
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: wasi-auth
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wasi-http-middleware-release-bundle
          path: wasi-auth/legacy/wasi-http-middleware
      - name: Create the release and upload the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/common.sh
          version="$(compat_value version)"
          # Same rule as release.yml: a version core followed by a hyphen is a
          # pre-release. This subtree is on an alpha line, so in practice it
          # always takes the first branch — but reading the version rather than
          # hardcoding it means promoting the line does the right thing without
          # a workflow edit. Never `--latest`: the root `wasi-auth` release is
          # what this repository's page should feature.
          if [[ "${version}" == *-* ]]; then
            maturity=(--prerelease)
          else
            maturity=()
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              "${maturity[@]}" \
              --title "wasi-http-middleware ${version}" \
              --notes "Attested bundle for the legacy/wasi-http-middleware subtree, produced by the verify job of this run: checksums, provenance, OCI manifest, cosign signature bundles and public key, the five middleware components, the conformance and test components, SBOMs, and WIT reports. The signing key is ephemeral per run, so a consumer pinning these digests must record them from these assets rather than from a local pipeline run. See legacy/wasi-http-middleware/CHANGELOG.md."
          fi
          # Every entry in SHA256SUMS is a provenance subject, so the
          # test-components are part of the attested set and ship with it. The
          # consumer's lane that exercises the composed chain also consumes
          # mock-authn-broker directly.
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            artifacts/SHA256SUMS \
            artifacts/provenance.intoto.json \
            artifacts/components/request-id.wasm \
            artifacts/components/security-headers.wasm \
            artifacts/components/cors.wasm \
            artifacts/components/authn-policy.wasm \
            artifacts/components/secure-defaults.wasm \
            artifacts/test-components/passthrough.wasm \
            artifacts/test-components/echo-service.wasm \
            artifacts/test-components/mock-authn-broker.wasm \
            artifacts/sbom/*.cdx.json \
            reports/wit/request-id.wit \
            reports/wit/security-headers.wit \
            reports/wit/cors.wit \
            reports/wit/authn-policy.wit \
            reports/wit/secure-defaults.wit \
            reports/wit/passthrough.wit \
            reports/supply-chain/manifest.json \
            reports/supply-chain/provenance.sigstore.json \
            reports/supply-chain/manifest.sigstore.json \
            reports/supply-chain/cosign.pub
