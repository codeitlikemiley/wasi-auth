[package]
name = "wasi-authz-http-pep"
description = "Standalone final-WASIp3 coarse HTTP authorization PEP component"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
http.workspace = true
wasi-authz-client = { workspace = true, features = ["wasip3"] }
wasi-authz-contract.workspace = true
wasi-authz-http = { path = "../../crates/wasi-authz-http", version = "=0.1.0-alpha.3" }
wasi-http-metadata.workspace = true
wasi-http-middleware-component-support.workspace = true
wasi-http-policy-core.workspace = true
wasip3 = { workspace = true, features = ["async-spawn"] }
wit-bindgen.workspace = true

[lints]
workspace = true
